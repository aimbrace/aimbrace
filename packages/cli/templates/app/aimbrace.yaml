# The app as data: which plugins it mounts, in what order, with what config. Edit this, not app.ts, to switch a plugin
# off (disabled: true) or change its config. `npm run lock` records exactly what the app is built from.
apiVersion: aimbrace/v1
kind: App
metadata:
  name: __APP_NAME__
  version: 0.1.0
parameters:
  hostname: { type: string, default: 127.0.0.1, description: The address the server listens on. }
plugins:
  - id: http
  - id: routes
  - id: server
    config:
      hostname: "{{parameters.hostname}}"
